name: RAFCODEPHI Profile Graph Falsification V1 (HOLD)
on:
  pull_request:
    paths:
      - 'scripts/validate_rafcodephi_profile_architecture.py'
      - 'scripts/tests/test_rafcodephi_profile_architecture.py'
      - 'docs/assurance/RAFCODEPHI_PROFILE_GRAPH_AUDIT_V1.md'
      - '.github/workflows/rafcodephi-profile-architecture-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Falsify profile graph contracts
        run: python3 scripts/tests/test_rafcodephi_profile_architecture.py
      - name: Resolve current output-producing recipes and RMR blobs
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p build/reports
          python3 scripts/validate_rafcodephi_profile_architecture.py \
            --root . \
            --source-sha "$CANDIDATE_SHA" \
            --out build/reports/rafcodephi-profile-architecture.json
          python3 scripts/validate_rafcodephi_federated_provenance.py
      - name: Read-only result boundaries
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("build/reports/rafcodephi-profile-architecture.json"))
          assert d["source_gate"]=="PASS_SCOPED"
          assert d["claim_allowed"] is False and d["release_allowed"] is False
          assert d["build_gate"]=="NOT_RUN" and d["device_gate"]=="NOT_RUN"
          assert all(x["artifact"]=="TOKEN_VAZIO_DEB" for x in d["output_producers"])
          print("PASS_SOURCE_ONLY; DEB=NOT_RUN; ANDROID=TOKEN_VAZIO; RELEASE=HOLD")
          PY
